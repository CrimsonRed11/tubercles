<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Silver Racing | 3D Model</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07111f;
    }

    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>

<body>
  <div id="viewer"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const viewer = document.getElementById('viewer');

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07111f);

    // Camera
    const camera = new THREE.PerspectiveCamera(42, 1, 0.001, 10000);
    camera.position.set(2, 2, 3);

    // Renderer
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    viewer.appendChild(renderer.domElement);

    // Touch / mouse interaction
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = true;
    controls.minDistance = 0.05;
    controls.maxDistance = 1000;

    // Lighting
    scene.add(
      new THREE.HemisphereLight(
        0xeaf4ff,
        0x162336,
        2.2
      )
    );

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
    keyLight.position.set(4, 6, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x9ec5ff, 1.7);
    fillLight.position.set(-5, 2, -4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 2);
    rimLight.position.set(0, -3, 6);
    scene.add(rimLight);

    let model = null;

    function frameObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      const distance =
        maxDim /
        (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5))) *
        1.35;

      camera.position.copy(
        center.clone().add(
          new THREE.Vector3(
            distance,
            distance * 0.65,
            distance
          )
        )
      );

      controls.target.copy(center);

      camera.near = Math.max(maxDim / 10000, 0.0001);
      camera.far = Math.max(maxDim * 100, 100);
      camera.updateProjectionMatrix();
      controls.update();
    }

    // Load STL
    const loader = new STLLoader();

    loader.load(
      'models/front-wheel-support.stl',

      (geometry) => {
        geometry.computeVertexNormals();
        geometry.center();

        const material = new THREE.MeshStandardMaterial({
          color: 0xc9d1da,
          metalness: 0.72,
          roughness: 0.24
        });

        model = new THREE.Mesh(geometry, material);

        model.rotation.x = -Math.PI / 2;

        scene.add(model);

        frameObject(model);
      },

      undefined,

      (error) => {
        console.error('Unable to load STL:', error);
      }
    );

    // Responsive renderer
    function resize() {
      const width = viewer.clientWidth;
      const height = viewer.clientHeight;

      renderer.setSize(width, height, false);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);
    resize();

    // Render
    function animate() {
      requestAnimationFrame(animate);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
